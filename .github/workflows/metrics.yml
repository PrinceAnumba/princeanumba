name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1) Overview: header, activity, community, repositories
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrinceAnumba
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Africa/Lome
          config_display: large
          committer_message: "chore: update overview metrics"

      # 2) Isometric contribution calendar (includes current & best streak)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrinceAnumba
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Africa/Lome
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: update calendar metrics"

      # 3) Most used languages
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrinceAnumba
          filename: metrics/languages.svg
          base: ""
          config_timezone: Africa/Lome
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, shell, dockerfile
          committer_message: "chore: update language metrics"

      # 4) Coding habits (when you commit, recent activity charts)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: PrinceAnumba
          filename: metrics/habits.svg
          base: ""
          config_timezone: Africa/Lome
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_days: 30
          committer_message: "chore: update habits metrics"
